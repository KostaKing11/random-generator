<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Podešavanja</title>
  <meta name="theme-color" content="#000000">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    .wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 28px 12% 48px;
    }
    @media (min-width: 400px) {
      .wrap { padding: 16px 16px 48px; }
    }

    #status {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 10px;
      color: #9ca3af;
    }
    #status .on { color: #22c55e; }
    #status .spin { color: #f97316; }
    #status b { color: #fff; }

    .list { display: grid; gap: 6px; }
    .name {
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: #1f2937;
      padding: 12px 10px;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
    }
    .name:active { background: #374151; }
    .name.armed { background: #2563eb; }
    .name.sending { background: #ca8a04; }
    .name.done { background: #16a34a; }
    .name.out { background: #111; color: #555; text-decoration: line-through; }
    .name.random { background: #312e81; }
    .name.random.armed { background: #4f46e5; }

    h2 {
      margin: 22px 0 8px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b7280;
      text-align: center;
    }
    .stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .stepper button {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: #1f2937;
      font-size: 24px;
      font-weight: 700;
    }
    .stepper span { font-size: 24px; font-weight: 800; min-width: 60px; text-align: center; }
    .toggle {
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: #1f2937;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
    }
    .toggle.on { background: #7c3aed; }
    .hint { text-align: center; color: #6b7280; font-size: 12px; margin-top: 6px; }

    .lock { display: grid; gap: 10px; text-align: center; padding-top: 20px; }
    .lock input {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 0;
      background: #1f2937;
      color: #fff;
      font-size: 17px;
      text-align: center;
    }
    .lock .err { color: #ef4444; font-size: 13px; min-height: 16px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <form class="lock" id="lock" hidden>
      <input id="pass" type="password" placeholder="šifra" autocomplete="current-password">
      <button class="name" type="submit">OK</button>
      <div class="err" id="lockErr"></div>
    </form>

    <div id="app" hidden>
      <div id="status">…</div>

      <div class="list" id="names"></div>

      <h2>Trajanje</h2>
      <div class="stepper">
        <button id="durMinus">−</button>
        <span id="durVal">8s</span>
        <button id="durPlus">+</button>
      </div>

      <h2>Namešteno važi</h2>
      <button class="toggle" id="keepBtn"></button>

      <h2>Ne sme da bude izvučen</h2>
      <div class="list" id="outNames"></div>
      <div class="hint">dodirni da izbaciš / vratiš</div>
    </div>
  </div>

  <script src="../shared.js"></script>
  <script>
    (() => {
      const PASS_HASH = '33dfdd3160831f202eb85fda3a9ddfafd21bc44e925bd587ccf460e6d136e45f';
      const NAMES = APP.NAMES;
      const $ = (id) => document.getElementById(id);

      // ---------- sifra (moze i link sa sifrom posle #, da ne kucas na satu) ----------

      async function sha256(text) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
      }

      function unlock() {
        store.set('tkp_unlocked', PASS_HASH);
        $('lock').hidden = true;
        $('app').hidden = false;
        start();
      }

      (async () => {
        const fromLink = decodeURIComponent(location.hash.slice(1));
        if (store.get('tkp_unlocked', '') === PASS_HASH || (fromLink && (await sha256(fromLink)) === PASS_HASH)) {
          unlock();
        } else {
          $('lock').hidden = false;
        }
      })();

      $('lock').addEventListener('submit', async (e) => {
        e.preventDefault();
        if ((await sha256($('pass').value.trim())) === PASS_HASH) unlock();
        else {
          $('lockErr').textContent = 'pogrešno';
          $('pass').value = '';
        }
      });

      // ---------- panel ----------

      function start() {
        const form = Object.assign({ keep: false, duration: 8, excluded: [] }, store.get('tkp_form', {}));
        const wheel = { state: null, until: 0, target: null, result: null, next: null, seen: 0 };
        let sending = null; // { name, mid }
        let doneName = null;
        let doneTimer = null;

        const spinningNow = () => wheel.state === 'spinning' && Date.now() < wheel.until;

        function saveForm() { store.set('tkp_form', form); }

        // Svaki dodir odmah salje: ako se tocak vrti menja ovaj spin, inace vazi za sledeci.
        function send(winner) {
          const { mid } = bus.send('cfg', { ...form, winner, now: true });
          sending = { name: winner || '🎲', mid };
          render();
        }

        function btn(label, cls, onClick) {
          const b = document.createElement('button');
          b.className = 'name ' + cls;
          b.textContent = label;
          b.addEventListener('click', onClick);
          return b;
        }

        function stateOf(key) {
          if (sending && sending.name === key) return 'sending';
          if (doneName === key) return 'done';
          if ((wheel.next || '🎲') === key && wheel.seen) return 'armed';
          return '';
        }

        // Dugmici se prave jednom; render samo menja boje (da se dodir ne izgubi).
        const pickBtns = { '🎲': btn('🎲 Nasumično', 'random', () => send(null)) };
        const outBtns = {};
        $('names').append(pickBtns['🎲']);
        for (const n of NAMES) {
          pickBtns[n] = btn(n, '', () => send(n));
          $('names').append(pickBtns[n]);
          outBtns[n] = btn(n, '', () => {
            form.excluded = form.excluded.includes(n)
              ? form.excluded.filter((x) => x !== n)
              : [...form.excluded, n];
            saveForm();
            sendSettings();
            render();
          });
          $('outNames').append(outBtns[n]);
        }

        function render() {
          for (const key in pickBtns) {
            pickBtns[key].className = 'name ' + (key === '🎲' ? 'random ' : '') + stateOf(key);
            pickBtns[key].hidden = form.excluded.includes(key);
          }
          for (const n of NAMES) outBtns[n].className = 'name' + (form.excluded.includes(n) ? ' out' : '');

          $('durVal').textContent = form.duration + 's';
          $('keepBtn').textContent = form.keep ? 'Za svaki spin' : 'Samo jednom';
          $('keepBtn').className = 'toggle' + (form.keep ? ' on' : '');
          renderStatus();
        }

        function renderStatus() {
          const s = $('status');
          if (!wheel.seen) {
            s.innerHTML = 'točak nije otvoren';
            return;
          }
          const next = wheel.next ? `<b></b>` : '🎲';
          if (spinningNow()) {
            s.innerHTML = `<span class="spin">● VRTI SE</span><br>staje na <b></b>`;
            s.querySelector('b').textContent = wheel.target;
          } else {
            s.innerHTML = `<span class="on">● SPREMAN</span><br>sledeći: ${next}`;
            if (wheel.next) s.querySelector('b').textContent = wheel.next;
          }
        }

        // Promena trajanja / izbacivanja / "svaki spin" cuva trenutno namesteno ime.
        let settingsTimer = null;
        function sendSettings() {
          clearTimeout(settingsTimer);
          settingsTimer = setTimeout(() => {
            const keepWinner = wheel.next && !form.excluded.includes(wheel.next) ? wheel.next : null;
            bus.send('cfg', { ...form, winner: keepWinner, now: false });
          }, 600);
        }

        $('durMinus').addEventListener('click', () => {
          form.duration = Math.max(3, form.duration - 1);
          saveForm();
          sendSettings();
          render();
        });
        $('durPlus').addEventListener('click', () => {
          form.duration = Math.min(20, form.duration + 1);
          saveForm();
          sendSettings();
          render();
        });
        $('keepBtn').addEventListener('click', () => {
          form.keep = !form.keep;
          saveForm();
          sendSettings();
          render();
        });

        function onStatus(m) {
          Object.assign(wheel, {
            state: m.state,
            until: m.until,
            target: m.target,
            result: m.result,
            next: m.next,
            seen: m.ts,
          });
          if (sending && m.ack === sending.mid) {
            doneName = sending.name;
            sending = null;
            clearTimeout(doneTimer);
            doneTimer = setTimeout(() => {
              doneName = null;
              render();
            }, 1500);
            if (navigator.vibrate) navigator.vibrate(60);
          }
          render();
        }

        const bus = createBus((m) => {
          if (m.type === 'status') onStatus(m);
        });
        bus.history().then((list) => {
          const statuses = list.filter((m) => m.type === 'status');
          if (statuses.length) onStatus(statuses[statuses.length - 1]);
          bus.connect();
          bus.send('ping');
        });

        setInterval(renderStatus, 500);
        render();
      }
    })();
  </script>
</body>
</html>
