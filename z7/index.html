<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Podešavanja</title>
  <meta name="theme-color" content="#07060d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07060d;
      --card: #131022;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f5f3ff;
      --muted: #8f8bb0;
      --hot: #ff2d55;
      --gold: #ffcf3f;
      --ok: #34d399;
      --violet: #8b5cf6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(ellipse at 50% 0%, #1d1235 0%, var(--bg) 60%) fixed;
      background-color: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 16px 120px;
    }
    h1 {
      margin: 8px 0 14px;
      font-family: Anton, Impact, sans-serif;
      font-weight: 400;
      font-size: 34px;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, #ffe08a, #ff8a00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .status { display: flex; align-items: center; gap: 12px; }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex: none;
      background: var(--muted);
    }
    .dot.idle { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
    .dot.spin { background: var(--hot); box-shadow: 0 0 14px var(--hot); animation: blink 0.5s infinite alternate; }
    @keyframes blink { to { opacity: 0.3; } }
    .status-main { font-weight: 900; font-size: 18px; }
    .status-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .armed {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 207, 63, 0.08);
      border: 1px solid rgba(255, 207, 63, 0.2);
      font-size: 14px;
    }
    .armed b { color: var(--gold); }
    .icon-btn {
      margin-left: auto;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      width: 38px;
      height: 38px;
      cursor: pointer;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .chip:active { transform: scale(0.95); }
    .chip:disabled { opacity: 0.25; cursor: default; }
    .chip.pick {
      background: linear-gradient(90deg, #ff2d55, #ff8a00);
      border-color: transparent;
      box-shadow: 0 4px 18px rgba(255, 45, 85, 0.45);
    }
    .chip.random.pick {
      background: linear-gradient(90deg, #7c3aed, #2563eb);
      box-shadow: 0 4px 18px rgba(124, 58, 237, 0.45);
    }
    .chip.out {
      background: rgba(255, 45, 85, 0.12);
      border-color: rgba(255, 45, 85, 0.5);
      color: #ff8aa0;
      text-decoration: line-through;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      font-size: 14px;
    }
    .row small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .switch { position: relative; width: 50px; height: 30px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      transition: background 0.2s;
      cursor: pointer;
    }
    .switch span::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }
    .switch input:checked + span { background: var(--hot); }
    .switch input:checked + span::after { transform: translateX(20px); }

    .dur { display: flex; align-items: baseline; gap: 6px; }
    .dur-val { font-family: Anton, Impact, sans-serif; font-size: 44px; line-height: 1; }
    .dur-unit { color: var(--muted); font-weight: 700; }
    input[type=range] {
      width: 100%;
      margin-top: 12px;
      accent-color: var(--hot);
      height: 28px;
    }

    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent, rgba(7, 6, 13, 0.95) 30%);
    }
    .confirm {
      display: block;
      width: 100%;
      max-width: 528px;
      margin: 0 auto;
      border: 0;
      border-radius: 16px;
      padding: 16px;
      font-family: Anton, Impact, sans-serif;
      font-size: 24px;
      letter-spacing: 0.14em;
      background: linear-gradient(90deg, #ff2d55, #ff8a00);
      box-shadow: 0 8px 30px rgba(255, 45, 85, 0.45);
      cursor: pointer;
    }
    .confirm:active { transform: scale(0.98); }
    .confirm.alt { background: linear-gradient(90deg, #7c3aed, #2563eb); box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4); }
    .confirm.ghost { background: rgba(255, 255, 255, 0.06); box-shadow: none; font-family: Inter, sans-serif; font-size: 15px; letter-spacing: 0; font-weight: 700; }

    .sheet-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: flex-end;
      z-index: 20;
    }
    .sheet-bg[hidden] { display: none; }
    .sheet {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px 22px 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      display: grid;
      gap: 10px;
      animation: up 0.25s ease-out;
    }
    .sheet h3 { margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 26px; letter-spacing: 0.05em; color: var(--hot); }
    .sheet p { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
    @keyframes up { from { transform: translateY(100%); } }

    .toast {
      position: fixed;
      left: 50%;
      top: 16px;
      transform: translate(-50%, -150%);
      max-width: calc(100% - 32px);
      background: #1f1a35;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s;
      z-index: 30;
    }
    .toast.show { transform: translate(-50%, 0); }
    .toast.good { border-color: rgba(52, 211, 153, 0.5); }
    .toast.bad { border-color: rgba(255, 45, 85, 0.6); }

    .lock {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      z-index: 40;
    }
    .lock[hidden] { display: none; }
    .lock form { width: 100%; max-width: 340px; display: grid; gap: 12px; text-align: center; }
    .lock input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 18px;
      text-align: center;
    }
    .lock .err { color: var(--hot); font-size: 14px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="lock" id="lock">
    <form id="lockForm">
      <h1>🔒</h1>
      <input id="pass" type="password" placeholder="Šifra" autocomplete="current-password">
      <button class="confirm" type="submit">UĐI</button>
      <div class="err" id="lockErr"></div>
    </form>
  </div>

  <div class="wrap">
    <h1>KONTROLA</h1>

    <div class="card">
      <div class="status">
        <div class="dot" id="dot"></div>
        <div>
          <div class="status-main" id="stMain">Povezujem…</div>
          <div class="status-sub" id="stSub">čekam točak</div>
        </div>
        <button class="icon-btn" id="pingBtn" title="Osveži">↻</button>
      </div>
      <div class="armed" id="armed" hidden></div>
    </div>

    <div class="card">
      <h2>Ko će biti izvučen</h2>
      <div class="chips" id="winnerChips"></div>
      <label class="row">
        <span>Važi za svaki spin<small>Isključeno = samo za jedan spin, posle opet nasumično</small></span>
        <span class="switch"><input type="checkbox" id="keep"><span></span></span>
      </label>
    </div>

    <div class="card">
      <h2>Koliko dugo se vrti</h2>
      <div class="dur"><span class="dur-val" id="durVal">8</span><span class="dur-unit">sekundi</span></div>
      <input type="range" id="dur" min="3" max="20" step="1" value="8">
    </div>

    <div class="card">
      <h2>Ne sme da bude izvučen</h2>
      <div class="chips" id="outChips"></div>
    </div>
  </div>

  <div class="bar"><button class="confirm" id="confirmBtn">POTVRDI</button></div>

  <div class="sheet-bg" id="sheet" hidden>
    <div class="sheet">
      <h3>TOČAK SE VRTI!</h3>
      <p id="sheetText">Hoćeš da promeniš ovaj spin ili da sačuvaš za sledeći?</p>
      <button class="confirm" id="nowBtn">PROMENI OVAJ SPIN</button>
      <button class="confirm alt" id="nextBtn">ZA SLEDEĆI SPIN</button>
      <button class="confirm ghost" id="cancelBtn">Otkaži</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../shared.js"></script>
  <script>
    (() => {
      const PASS_HASH = '33dfdd3160831f202eb85fda3a9ddfafd21bc44e925bd587ccf460e6d136e45f';
      const NAMES = APP.NAMES;
      const $ = (id) => document.getElementById(id);

      // ---------- sifra ----------

      async function sha256(text) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
      }

      if (store.get('tkp_unlocked', '') === PASS_HASH) $('lock').hidden = true;
      $('lockForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const h = await sha256($('pass').value.trim());
        if (h === PASS_HASH) {
          store.set('tkp_unlocked', h);
          $('lock').hidden = true;
        } else {
          $('lockErr').textContent = 'Pogrešna šifra';
          $('pass').value = '';
        }
      });

      // ---------- forma ----------

      const form = Object.assign(
        { winner: null, keep: false, duration: 8, excluded: [] },
        store.get('tkp_form', {}),
      );

      function saveForm() { store.set('tkp_form', form); }

      function chip(label, cls, onClick) {
        const b = document.createElement('button');
        b.className = 'chip ' + cls;
        b.textContent = label;
        b.addEventListener('click', onClick);
        return b;
      }

      function render() {
        const wc = $('winnerChips');
        wc.textContent = '';
        wc.append(chip('🎲 Nasumično', 'random' + (form.winner ? '' : ' pick'), () => {
          form.winner = null;
          saveForm();
          render();
        }));
        for (const n of NAMES) {
          const b = chip(n, form.winner === n ? 'pick' : '', () => {
            form.winner = form.winner === n ? null : n;
            saveForm();
            render();
          });
          b.disabled = form.excluded.includes(n);
          wc.append(b);
        }

        const oc = $('outChips');
        oc.textContent = '';
        for (const n of NAMES) {
          const b = chip(n, form.excluded.includes(n) ? 'out' : '', () => {
            form.excluded = form.excluded.includes(n)
              ? form.excluded.filter((x) => x !== n)
              : [...form.excluded, n];
            saveForm();
            render();
          });
          b.disabled = form.winner === n;
          oc.append(b);
        }

        $('keep').checked = form.keep;
        $('dur').value = form.duration;
        $('durVal').textContent = form.duration;
      }

      $('keep').addEventListener('change', (e) => {
        form.keep = e.target.checked;
        saveForm();
      });
      $('dur').addEventListener('input', (e) => {
        form.duration = Number(e.target.value);
        $('durVal').textContent = form.duration;
        saveForm();
      });

      // ---------- veza sa tockom ----------

      const wheel = { state: null, until: 0, target: null, result: null, next: null, keep: false, seen: 0 };
      let pendingAck = null;

      const spinningNow = () => wheel.state === 'spinning' && Date.now() < wheel.until;

      function onStatus(m) {
        Object.assign(wheel, {
          state: m.state,
          until: m.until,
          target: m.target,
          result: m.result,
          next: m.next,
          keep: m.keep,
          seen: m.ts,
        });
        if (m.ack && m.ack === pendingAck) {
          pendingAck = null;
          toast(m.applied === 'now' ? '✓ Točak primio — menja ovaj spin' : '✓ Točak primio — važi za sledeći spin', 'good');
        }
        renderStatus();
      }

      function ago(ts) {
        const s = Math.round((Date.now() - ts) / 1000);
        if (s < 60) return 'upravo';
        if (s < 3600) return `pre ${Math.floor(s / 60)} min`;
        return `pre ${Math.floor(s / 3600)} h`;
      }

      function renderStatus() {
        const dot = $('dot');
        const armed = $('armed');
        if (!wheel.seen) {
          dot.className = 'dot';
          $('stMain').textContent = 'Točak nije otvoren';
          $('stSub').textContent = 'otvori glavni sajt pa pritisni ↻';
          armed.hidden = true;
          return;
        }
        if (spinningNow()) {
          dot.className = 'dot spin';
          $('stMain').textContent = `VRTI SE · ${((wheel.until - Date.now()) / 1000).toFixed(1)}s`;
          $('stSub').textContent = `staje na: ${wheel.target}`;
        } else {
          dot.className = 'dot idle';
          $('stMain').textContent = 'SPREMAN';
          $('stSub').textContent = (wheel.result ? `poslednji: ${wheel.result} · ` : '') + `javio se ${ago(wheel.seen)}`;
        }
        armed.hidden = false;
        armed.innerHTML = wheel.next
          ? `Sledeći spin: <b></b> ${wheel.keep ? '(svaki put)' : '(jednom)'}`
          : 'Sledeći spin: <b>nasumično</b>';
        if (wheel.next) armed.querySelector('b').textContent = wheel.next;
      }

      const bus = createBus((m) => {
        if (m.type === 'status') onStatus(m);
      });

      bus.history().then((list) => {
        const statuses = list.filter((m) => m.type === 'status');
        if (statuses.length) onStatus(statuses[statuses.length - 1]);
        bus.connect();
        bus.send('ping');
      });

      setInterval(renderStatus, 200);

      let toastTimer = null;
      function toast(text, kind = '') {
        const t = $('toast');
        t.textContent = text;
        t.className = 'toast show ' + kind;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (t.className = 'toast ' + kind), 2800);
      }

      async function send(now) {
        $('sheet').hidden = true;
        if (form.winner && form.excluded.includes(form.winner)) form.winner = null;
        const { mid, sent } = bus.send('cfg', { ...form, now });
        pendingAck = mid;
        const ok = await sent;
        if (!pendingAck) return; // tocak je vec potvrdio
        if (!ok) {
          toast('⚠ Nije poslato — proveri internet', 'bad');
          return;
        }
        toast(now ? 'Šaljem… menja ovaj spin' : '✓ Sačuvano — primeniće se na sledeći spin', 'good');
      }

      $('confirmBtn').addEventListener('click', () => {
        if (spinningNow()) {
          $('sheetText').textContent = form.winner
            ? `Ako promeniš ovaj spin, točak će nastaviti da se vrti i stati na: ${form.winner}.`
            : 'Hoćeš da promeniš ovaj spin ili da sačuvaš za sledeći?';
          $('sheet').hidden = false;
        } else {
          send(false);
        }
      });
      $('nowBtn').addEventListener('click', () => send(true));
      $('nextBtn').addEventListener('click', () => send(false));
      $('cancelBtn').addEventListener('click', () => ($('sheet').hidden = true));
      $('sheet').addEventListener('click', (e) => {
        if (e.target.id === 'sheet') $('sheet').hidden = true;
      });
      $('pingBtn').addEventListener('click', () => bus.send('ping'));

      render();
      renderStatus();
    })();
  </script>
</body>
</html>
