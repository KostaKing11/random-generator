<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Točak 1E</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="corner">
    <button id="muteBtn" class="icon-btn" title="Zvuk">🔊</button>
    <button id="fsBtn" class="icon-btn" title="Ceo ekran">⛶</button>
  </div>

  <main>
    <h1>Ko je na redu? <span class="tag">1E</span></h1>

    <div class="stage" id="stage">
      <canvas id="wheel"></canvas>
    </div>

    <button id="spinBtn" class="spin-btn">Zavrti</button>
  </main>

  <div id="winner" class="winner" hidden>
    <div class="winner-card">
      <div class="winner-label">Na redu je</div>
      <div id="winnerName" class="winner-name"></div>
      <button id="againBtn" class="spin-btn">Zavrti opet</button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="wheel.js"></script>
</body>
</html>
